<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white p-3 shadow"
         style="width:250px; min-height:100vh;">

        <h3 class="text-center mb-4">SMS</h3>

        <a href="{% url 'home' %}"
           class="btn btn-dark w-100 text-start mb-2">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="{% url 'add_student' %}"
           class="btn btn-dark w-100 text-start mb-2">
            <i class="bi bi-person-plus"></i>
            Add Student
        </a>

        <a href="{% url 'attendance_list' %}"
           class="btn btn-dark w-100 text-start mb-2">
            <i class="bi bi-calendar-check"></i>
            Attendance
        </a>

        <a href="{% url 'export_pdf' %}"
           class="btn btn-dark w-100 text-start mb-2">
            <i class="bi bi-file-earmark-pdf-fill"></i>
            Export PDF
        </a>

        <a href="{% url 'export_excel' %}"
           class="btn btn-dark w-100 text-start mb-2">
            <i class="bi bi-file-earmark-excel-fill"></i>
            Export Excel
        </a>

        <a href="{% url 'logout' %}"
           class="btn btn-danger w-100 mt-4">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

    <!-- Main Content -->
    <div class="flex-grow-1">

        <!-- Navbar -->
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <span class="navbar-brand">
                    Student Management System
                </span>
            </div>
        </nav>

        <div class="container mt-4">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
